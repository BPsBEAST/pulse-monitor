name: Live PULSE Worker smoke test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/live-smoke.yml"
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public Worker endpoints
        shell: bash
        run: |
          set -euo pipefail
          API="https://pulse-monitor.brunofranciscospinto.workers.dev"
          ORIGIN="https://bpsbeast.github.io"
          echo "Checking the live PULSE Worker (only publicly documented example targets)"
          fail=0
          for route in "/health" "/check?url=https%3A%2F%2Fexample.com%2F" "/check?url=https%3A%2F%2Fformacao.inem.pt%2F" "/ip-info?ip=1.1.1.1" "/security?url=https%3A%2F%2Fexample.com%2F"; do
            echo "::group::Request $route"
            tmp=$(mktemp)
            status=$(curl -sS --max-time 18 -H "Origin: $ORIGIN" -H "Accept: application/json" -o "$tmp" -w "%{http_code}" "$API$route" || true)
            echo "HTTP status: $status"
            cat "$tmp" || true
            echo
            if [ "$status" != "200" ]; then
              echo "::error::Endpoint ${route%%\?*} returned $status (check Cloudflare deployment)"
              fail=1
            fi
            if ! grep -q '"status"\|"ip"\|"checks"' "$tmp"; then
              echo "::error::Unexpected endpoint response"
              fail=1
            fi
            rm "$tmp"
            echo "::endgroup::"
          done
          exit $fail

      - name: Verify Worker 0.8 and Security API response
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN="https://bpsbeast.github.io"
          API="https://pulse-monitor.brunofranciscospinto.workers.dev"
          health=$(curl -fsS --max-time 15 -H "Origin: $ORIGIN" "$API/health")
          node -e '
            const d=JSON.parse(process.argv[1]);
            if(d.service!=="PULSE"||d.version!=="0.8"||d.status!=="ok") {
              console.error("Expected PULSE Worker 0.8, got:",d);
              process.exit(1);
            }
            console.log("Published Worker version:",d.version);
          ' "$health"
          report=$(curl -fsS --max-time 18 -H "Origin: $ORIGIN" "$API/security?url=https%3A%2F%2Fexample.com%2F")
          node -e '
            const d=JSON.parse(process.argv[1]);
            if(d.hostname!=="example.com"||!Array.isArray(d.checks)||
               !Array.isArray(d.limitations)||typeof d.http?.status!=="string"||
               !("score" in d)||!Number.isFinite(Date.parse(d.checkedAt))) {
              console.error("Invalid /security response:",JSON.stringify(d).slice(0,600));
              process.exit(1);
            }
            console.log("Security endpoint validated. HTTP:",d.http.code,
              "Checks:",d.checks.length,"Score:",d.score);
          ' "$report"

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Create security PDF using a real published Worker response
        run: node tests/security-live-pdf.mjs
      - name: Validate PDF structure and extracted content
        run: |
          python -m pip install --quiet pypdf
          python - <<'PY'
          from pypdf import PdfReader
          file="artifacts/security/pulse-security-example-com-live.pdf"
          reader=PdfReader(file,strict=True)
          assert len(reader.pages)>=1
          extracted="\n".join(page.extract_text() or "" for page in reader.pages)
          assert "PULSE" in extracted and "example.com" in extracted
          assert "VERIFICA" in extracted and "LIMITA" in extracted
          print(f"Live report PDF: {len(reader.pages)} page(s), {len(extracted)} extracted characters")
          PY
      - name: Upload real PDF report from security smoke test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pulse-live-security-pdf
          path: artifacts/security/*.pdf
          if-no-files-found: ignore
