name: PULSE code checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check frontend JavaScript syntax
        run: node --check app.js
      - name: Check monitoring modules syntax
        run: |
          node --check pulse-core.mjs
          node --check pulse-storage.mjs
          node --check worker/index.js
          node --check pulse-security.mjs
          node --check pulse-security-pdf.mjs
      - name: Run Worker API unit tests
        run: node --test tests/*.test.mjs

  browser-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test tools
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Test desktop, mobile and empty dashboards
        run: node tests/browser-layout.mjs
      - name: Save layout screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pulse-layout-screenshots
          path: artifacts/browser/*.png
          if-no-files-found: ignore
