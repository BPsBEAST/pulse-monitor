name: PULSE code checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check frontend JavaScript syntax
        run: node --check app.js
      - name: Check monitoring modules syntax
        run: |
          node --check pulse-core.mjs
          node --check pulse-storage.mjs
          node --check worker/index.js
      - name: Run Worker API unit tests
        run: node --test tests/*.test.mjs
